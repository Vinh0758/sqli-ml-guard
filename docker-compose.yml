services:
  postgres:
    image: postgres:16
    container_name: lab_postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_only_password
      POSTGRES_DB: demo
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: lab_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: lab@example.com
      PGADMIN_DEFAULT_PASSWORD: lab_only_password
    ports: ["127.0.0.1:5050:80"]
    depends_on: [postgres]

  dvwa:
    image: vulnerables/web-dvwa
    container_name: lab_dvwa
    ports: ["127.0.0.1:8081:80"]
  modsec:
    image: owasp/modsecurity-crs:nginx
    container_name: lab_modsec
    environment:
      BACKEND: "http://host.docker.internal:8001"
      PORT: "8080"
      PARANOIA: "1"
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      MODSEC_RULE_ENGINE: "On"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["127.0.0.1:8080:8080"]
volumes:
  pgdata: